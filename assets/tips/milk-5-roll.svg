<g clip-path="url(#p)"><g class="spin"><path d="M160 150m-30 0a30 22 0 1 1 60 0" stroke="#623CEA" stroke-width="5"/><path d="M190 150l-8 -10M190 150l10 -8" stroke="#623CEA" stroke-width="5"/></g></g>
<path d="M108 96H212L202 196Q160 208 118 196Z" stroke="#1B1B1E" stroke-width="4" fill="none"/><path d="M108 96L94 82L122 96Z" stroke="#1B1B1E" stroke-width="4" fill="none"/><path d="M210 112Q252 114 244 152Q240 178 206 178" stroke="#1B1B1E" stroke-width="6"/>
<path d="M228 0V60Q228 76 214 84L166 170" stroke="#1B1B1E" stroke-width="16"/><path d="M228 0V60Q228 76 214 84L166 170" stroke="#C9CDD6" stroke-width="8"/>
<g transform="translate(276 120)"><rect x="-9" y="-70" width="18" height="120" rx="9" fill="#FBFFFE" stroke="#1B1B1E" stroke-width="4"/><rect x="-9" y="-42" width="18" height="26" fill="#F786AA" opacity=".9"/><circle cy="60" r="16" fill="#96031A" stroke="#1B1B1E" stroke-width="4"/><rect class="bob" x="-4" y="-16" width="8" height="70" rx="4" fill="#96031A"/></g>
<text x="276" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#96031A">60–65°</text>
