<path d="M108 96H212L202 196Q160 208 118 196Z" stroke="#1B1B1E" stroke-width="4" fill="none"/><path d="M108 96L94 82L122 96Z" stroke="#1B1B1E" stroke-width="4" fill="none"/><path d="M210 112Q252 114 244 152Q240 178 206 178" stroke="#1B1B1E" stroke-width="6"/>
<g class="tilt" style="transform-origin:96px 40px"><g transform="rotate(-38 70 50)"><rect x="34" y="14" width="64" height="86" rx="8" fill="#623CEA"/><path d="M34 34H98" stroke="#FBFFFE" stroke-width="3" opacity=".5"/><rect x="50" y="52" width="32" height="30" rx="6" fill="#FBFFFE"/><path d="M60 -2H88L98 14H34Z" fill="#F786AA" stroke="#1B1B1E" stroke-width="3"/></g></g>
<path class="flow" d="M116 76Q128 96 140 126" stroke="#FBFFFE" stroke-width="7"/><path d="M116 76Q128 96 140 126" stroke="#1B1B1E" stroke-opacity=".25" stroke-width="2" fill="none"/>
<g transform="translate(262 42)"><circle r="26" fill="#623CEA"/><g stroke="#FBFFFE" stroke-width="3.5"><path d="M0 -14V14M-12 -7L12 7M-12 7L12 -7"/></g></g>
