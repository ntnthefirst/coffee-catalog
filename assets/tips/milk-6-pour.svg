<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" stroke-linejoin="round" stroke-linecap="round"><style>
.steam{fill:none;stroke:#1B1B1E;stroke-opacity:.28;stroke-width:4;stroke-linecap:round;animation:up 2.4s ease-in infinite;opacity:0}
.steam.b{animation-delay:.6s}.steam.c{animation-delay:1.2s}
@keyframes up{0%{opacity:0;transform:translateY(10px)}35%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.bub{fill:#FBFFFE;stroke:#1B1B1E;stroke-opacity:.35;stroke-width:2;animation:rise 2s ease-in infinite;opacity:0}
.bub.b{animation-delay:.5s}.bub.c{animation-delay:1s}.bub.d{animation-delay:1.5s}
@keyframes rise{0%{opacity:0;transform:translateY(12px)}30%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.spin{transform-origin:160px 150px;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.flow{stroke-dasharray:10 8;animation:flow .8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.tilt{transform-origin:160px 150px;animation:tilt 3s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(-6deg)}}
</style>
<ellipse cx="180" cy="220" rx="100" ry="8" fill="#1B1B1E" opacity=".08"/>
<path d="M120 150H240L226 210Q180 222 134 210Z" fill="#FBFFFE" stroke="#1B1B1E" stroke-width="4"/>
<ellipse cx="180" cy="150" rx="60" ry="12" fill="#6B3F26" stroke="#1B1B1E" stroke-width="4"/>
<path d="M180 154C160 146 164 138 172 138C176 138 180 142 180 145C180 142 184 138 188 138C196 138 200 146 180 154Z" fill="#FBFFFE"/>
<path d="M240 158Q274 158 270 186Q266 204 234 200" stroke="#1B1B1E" stroke-width="6"/>
<g class="tilt" style="transform-origin:120px 90px"><g transform="rotate(-32 130 80)"><path d="M70 40H170L160 130Q120 142 80 130Z" fill="#E4E7EE" stroke="#1B1B1E" stroke-width="4"/><path d="M70 40L56 26L84 40Z" fill="#E4E7EE" stroke="#1B1B1E" stroke-width="4"/><path d="M168 56Q208 58 200 96Q196 120 164 120" stroke="#1B1B1E" stroke-width="6"/></g></g>
<path class="flow" d="M76 84Q112 104 168 138" stroke="#FBFFFE" stroke-width="7"/>
<g transform="translate(268 50)"><circle r="28" fill="#F786AA"/><path d="M0 12C-14 4 -14 -8 -6 -8C-2 -8 0 -5 0 -3C0 -5 2 -8 6 -8C14 -8 14 4 0 12Z" fill="#FBFFFE"/></g>
</svg>
