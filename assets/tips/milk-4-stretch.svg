<circle class="bub" cx="130" cy="150" r="5"/><circle class="bub b" cx="146" cy="160" r="4"/><circle class="bub c" cx="122" cy="172" r="4"/><circle class="bub d" cx="140" cy="140" r="3"/></g>
<path d="M110 130Q126 122 142 130T174 130T206 130" stroke="#F786AA" stroke-width="5"/>
<path d="M108 96H212L202 196Q160 208 118 196Z" stroke="#1B1B1E" stroke-width="4" fill="none"/><path d="M108 96L94 82L122 96Z" stroke="#1B1B1E" stroke-width="4" fill="none"/><path d="M210 112Q252 114 244 152Q240 178 206 178" stroke="#1B1B1E" stroke-width="6"/>
<path d="M228 0V60Q228 76 214 84L150 130" stroke="#1B1B1E" stroke-width="16"/><path d="M228 0V60Q228 76 214 84L150 130" stroke="#C9CDD6" stroke-width="8"/>
<g stroke="#F786AA" stroke-width="4"><path class="pulse" d="M118 116L106 108"/><path class="pulse" d="M124 108L116 94" style="animation-delay:.2s"/><path class="pulse" d="M136 106L134 92" style="animation-delay:.4s"/></g>
