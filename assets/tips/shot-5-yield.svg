<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" stroke-linejoin="round" stroke-linecap="round"><style>
.heat{fill:none;stroke:#96031A;stroke-opacity:.55;stroke-width:4;stroke-linecap:round;animation:up 2.2s ease-in infinite;opacity:0}
.heat.b{animation-delay:.5s}.heat.c{animation-delay:1s}
.steam{fill:none;stroke:#1B1B1E;stroke-opacity:.28;stroke-width:4;stroke-linecap:round;animation:up 2.4s ease-in infinite;opacity:0}
@keyframes up{0%{opacity:0;transform:translateY(10px)}35%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.press{animation:press 1.8s ease-in-out infinite}
@keyframes press{0%,100%{transform:translateY(-14px)}50%{transform:translateY(8px)}}
.flow{stroke-dasharray:8 7;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-15}}
.knob{animation:knob 3.6s ease-in-out infinite}
@keyframes knob{0%,100%{transform:translateX(-70px)}50%{transform:translateX(70px)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 2.4s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleY(.9)}50%{transform:scaleY(1)}}
</style>
<ellipse cx="140" cy="224" rx="90" ry="8" fill="#1B1B1E" opacity=".08"/>
<path d="M84 84H196L182 208Q140 220 98 208Z" fill="#FBFFFE" fill-opacity=".85" stroke="#1B1B1E" stroke-width="4"/>
<clipPath id="c"><path d="M84 84H196L182 208Q140 220 98 208Z"/></clipPath>
<g clip-path="url(#c)"><rect x="70" y="132" width="140" height="100" fill="#3A2012"/><rect x="70" y="124" width="140" height="14" fill="#B98650"/></g>
<path d="M84 84H196L182 208Q140 220 98 208Z" stroke="#1B1B1E" stroke-width="4" fill="none"/>
<path d="M210 132H240M210 176H240" stroke="#623CEA" stroke-width="4"/><circle cx="210" cy="132" r="5" fill="#623CEA"/><circle cx="210" cy="176" r="5" fill="#F786AA"/>
<text x="248" y="138" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#623CEA">50</text><text x="248" y="182" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#1B1B1E">25</text><text x="280" y="120" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#1B1B1E" opacity=".6">ml</text>
<path class="steam" d="M118 66c-6-8 6-14 0-22"/><path class="steam" d="M144 66c-6-8 6-14 0-22" style="animation-delay:.6s"/>
