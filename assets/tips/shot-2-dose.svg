<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" stroke-linejoin="round" stroke-linecap="round"><style>
.heat{fill:none;stroke:#96031A;stroke-opacity:.55;stroke-width:4;stroke-linecap:round;animation:up 2.2s ease-in infinite;opacity:0}
.heat.b{animation-delay:.5s}.heat.c{animation-delay:1s}
.steam{fill:none;stroke:#1B1B1E;stroke-opacity:.28;stroke-width:4;stroke-linecap:round;animation:up 2.4s ease-in infinite;opacity:0}
@keyframes up{0%{opacity:0;transform:translateY(10px)}35%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.press{animation:press 1.8s ease-in-out infinite}
@keyframes press{0%,100%{transform:translateY(-14px)}50%{transform:translateY(8px)}}
.flow{stroke-dasharray:8 7;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-15}}
.knob{animation:knob 3.6s ease-in-out infinite}
@keyframes knob{0%,100%{transform:translateX(-70px)}50%{transform:translateX(70px)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 2.4s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleY(.9)}50%{transform:scaleY(1)}}
</style>
<ellipse cx="160" cy="222" rx="130" ry="8" fill="#1B1B1E" opacity=".08"/>
<g><path d="M40 140H136L126 194Q88 206 50 194Z" fill="#C9CDD6" stroke="#1B1B1E" stroke-width="4"/><path d="M52 150H124L116 186Q88 194 60 186Z" fill="#E4E7EE" stroke="#1B1B1E" stroke-width="2.5" stroke-dasharray="5 5"/><path class="grow" d="M46 140Q88 96 130 140Z" fill="#6B3F26" stroke="#1B1B1E" stroke-width="4"/></g>
<g><path d="M176 132H288L276 194Q232 208 188 194Z" fill="#C9CDD6" stroke="#1B1B1E" stroke-width="4"/><path d="M190 144H274L266 186Q232 196 198 186Z" fill="#E4E7EE" stroke="#1B1B1E" stroke-width="2.5" stroke-dasharray="5 5"/><path class="grow" d="M182 132Q232 76 282 132Z" fill="#6B3F26" stroke="#1B1B1E" stroke-width="4" style="animation-delay:.3s"/></g>
<rect x="56" y="34" width="64" height="34" rx="17" fill="#F786AA"/><text x="88" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#1B1B1E">8 g</text>
<rect x="200" y="24" width="64" height="34" rx="17" fill="#623CEA"/><text x="232" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#FBFFFE">15 g</text>
<text x="88" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#1B1B1E" opacity=".6">SINGLE</text><text x="232" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#1B1B1E" opacity=".6">DOUBLE</text>
</svg>
