<path d="M108 96H212L202 196Q160 208 118 196Z" stroke="#1B1B1E" stroke-width="4" fill="none"/><path d="M108 96L94 82L122 96Z" stroke="#1B1B1E" stroke-width="4" fill="none"/><path d="M210 112Q252 114 244 152Q240 178 206 178" stroke="#1B1B1E" stroke-width="6"/>
<path d="M228 0V60Q228 76 214 84L150 136" stroke="#1B1B1E" stroke-width="16"/><path d="M228 0V60Q228 76 214 84L150 136" stroke="#C9CDD6" stroke-width="8"/>
<circle class="pulse" cx="146" cy="140" r="16" stroke="#F786AA" stroke-width="4"/>
<path d="M126 104Q110 120 122 134" stroke="#623CEA" stroke-width="4" stroke-dasharray="2 8"/>
<g transform="translate(60 56)"><circle r="30" fill="#623CEA"/><path d="M-14 6L0 -10L14 6M0 -10V16" stroke="#FBFFFE" stroke-width="4"/></g>
