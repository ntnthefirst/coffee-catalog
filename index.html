<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dedica Coffee</title>
  <meta name="description" content="60 hot and iced coffee recipes with exact measurements for the De'Longhi Dedica Arte. Find the strongest, build your own and learn to steam milk.">
  <meta name="theme-color" content="#FBFFFE">
  <meta property="og:title" content="Dedica Coffee">
  <meta property="og:description" content="Recipes, strength ranking and a coffee builder for the De'Longhi Dedica Arte.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23623CEA'/%3E%3Cpath d='M18 26h24v10a10 10 0 0 1-10 10h-4a10 10 0 0 1-10-10z' fill='%23FBFFFE'/%3E%3Cpath d='M42 29h3a5 5 0 0 1 0 10h-3' stroke='%23FBFFFE' stroke-width='4' fill='none'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/fredoka-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="app">
    <!-- desktop rail -->
    <aside class="rail">
      <a class="rail__logo" href="#/catalog" aria-label="Dedica Coffee"><i class="ic" style="-webkit-mask-image:url(assets/icons/coffee.svg);mask-image:url(assets/icons/coffee.svg)" aria-hidden="true"></i></a>
      <nav class="rail__nav" aria-label="Main">
        <a class="navbtn" data-nav="catalog" href="#/catalog"><i class="ic" style="-webkit-mask-image:url(assets/icons/layout-grid.svg);mask-image:url(assets/icons/layout-grid.svg)" aria-hidden="true"></i><span>Coffee</span></a>
        <a class="navbtn" data-nav="strongest" href="#/strongest"><i class="ic" style="-webkit-mask-image:url(assets/icons/bolt.svg);mask-image:url(assets/icons/bolt.svg)" aria-hidden="true"></i><span>Strongest</span></a>
        <a class="navbtn" data-nav="builder" href="#/builder"><i class="ic" style="-webkit-mask-image:url(assets/icons/adjustments-horizontal.svg);mask-image:url(assets/icons/adjustments-horizontal.svg)" aria-hidden="true"></i><span>Build</span></a>
      </nav>
      <span class="rail__spacer"></span>
      <button class="navbtn" type="button" data-action="tips"><i class="ic" style="-webkit-mask-image:url(assets/icons/bulb.svg);mask-image:url(assets/icons/bulb.svg)" aria-hidden="true"></i><span>Tips</span></button>
      <a class="navbtn" href="about.html"><i class="ic" style="-webkit-mask-image:url(assets/icons/info-circle.svg);mask-image:url(assets/icons/info-circle.svg)" aria-hidden="true"></i><span>About</span></a>
    </aside>

    <div class="main">
      <main id="main">
        <!-- COFFEE -->
        <section class="view" data-view="catalog" aria-labelledby="t-catalog">
          <header class="vh">
            <div><h1 class="vh__title" id="t-catalog">Coffee</h1><p class="vh__sub" id="count" aria-live="polite"></p></div>
            <div class="vh__actions"><a class="iconbtn" href="about.html" aria-label="About"><i class="ic" style="-webkit-mask-image:url(assets/icons/info-circle.svg);mask-image:url(assets/icons/info-circle.svg)" aria-hidden="true"></i></a></div>
          </header>
          <div class="searchbar">
            <label class="search"><i class="ic" style="-webkit-mask-image:url(assets/icons/search.svg);mask-image:url(assets/icons/search.svg)" aria-hidden="true"></i>
              <input id="q" type="search" placeholder="Search coffee, syrup, spice" autocomplete="off" aria-label="Search">
              <button class="search__clear" id="q-clear" type="button" aria-label="Clear search"><i class="ic" style="-webkit-mask-image:url(assets/icons/x.svg);mask-image:url(assets/icons/x.svg)" aria-hidden="true"></i></button>
            </label>
            <button class="iconbtn iconbtn--lg" id="sort-btn" type="button" aria-label="Sort" aria-haspopup="menu" aria-expanded="false"><i class="ic" style="-webkit-mask-image:url(assets/icons/arrows-sort.svg);mask-image:url(assets/icons/arrows-sort.svg)" aria-hidden="true"></i></button>
          </div>
          <div class="strip" id="strip" role="group" aria-label="Filters"></div>
          <div class="tiles" id="tiles"></div>
          <div class="empty" id="empty" hidden>
            <i class="ic" style="-webkit-mask-image:url(assets/icons/coffee-off.svg);mask-image:url(assets/icons/coffee-off.svg)" aria-hidden="true"></i><h3>No coffee found</h3>
            <button class="btn btn--soft" id="reset-filters" type="button"><i class="ic" style="-webkit-mask-image:url(assets/icons/refresh.svg);mask-image:url(assets/icons/refresh.svg)" aria-hidden="true"></i>Clear filters</button>
          </div>
        </section>

        <!-- STRONGEST -->
        <section class="view" data-view="strongest" hidden aria-labelledby="t-strong">
          <header class="vh"><div><h1 class="vh__title" id="t-strong">Strongest</h1><p class="vh__sub">Ranked by coffee per sip</p></div></header>
          <div class="board-controls" id="board-controls"></div>
          <ol id="board"></ol>
          <button class="btn btn--ghost board-more" id="board-more" type="button"></button>
        </section>

        <!-- BUILD -->
        <section class="view" data-view="builder" hidden aria-labelledby="t-build">
          <header class="vh"><div><h1 class="vh__title" id="t-build">Build</h1><p class="vh__sub">Make it yours</p></div></header>
          <div class="builder" id="builder"></div>
        </section>
      </main>
    </div>

    <!-- phone tab bar -->
    <nav class="tabbar" aria-label="Main">
      <a class="navbtn" data-nav="catalog" href="#/catalog"><i class="ic" style="-webkit-mask-image:url(assets/icons/layout-grid.svg);mask-image:url(assets/icons/layout-grid.svg)" aria-hidden="true"></i><span>Coffee</span></a>
      <a class="navbtn" data-nav="strongest" href="#/strongest"><i class="ic" style="-webkit-mask-image:url(assets/icons/bolt.svg);mask-image:url(assets/icons/bolt.svg)" aria-hidden="true"></i><span>Strongest</span></a>
      <a class="navbtn" data-nav="builder" href="#/builder"><i class="ic" style="-webkit-mask-image:url(assets/icons/adjustments-horizontal.svg);mask-image:url(assets/icons/adjustments-horizontal.svg)" aria-hidden="true"></i><span>Build</span></a>
      <button class="navbtn" type="button" data-action="tips"><i class="ic" style="-webkit-mask-image:url(assets/icons/bulb.svg);mask-image:url(assets/icons/bulb.svg)" aria-hidden="true"></i><span>Tips</span></button>
    </nav>
  </div>

  <dialog id="detail" class="sheet" aria-label="Recipe"></dialog>
  <dialog id="tips" class="sheet" aria-label="Tips"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem;text-align:center">Dedica Coffee needs JavaScript to show the recipes.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
